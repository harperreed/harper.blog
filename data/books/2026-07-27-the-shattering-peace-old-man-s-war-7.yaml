description: "<b>After a decade, acclaimed science fiction master John Scalzi returns\
  \ to the galaxy of the Old Man's War series with the long awaited seventh book,\
  \ <i>The Shattering Peace</i></b><br /><br />THE PEACE IS SHATTERING<br /><br />For\
  \ a decade, peace has reigned in interstellar space. A tripartate agreement between\
  \ the Colonial Union, the Earth, and the alien Conclave has kept the forces of war\
  \ at bay, even when some would have preferred to return to the fighting and struggle\
  \ of former times. For now, more sensible heads have prevailed \u2013 and have even\
  \ championed unity.<br /><br />But now, there is a new force that threatens the\
  \ hard-maintained peace: The Consu, the most advanced intelligent species humans\
  \ have ever met, are on the cusp of a species-defining civil war. This war is between\
  \ Consu factions... but nothing the Consu ever do is just about them. The Colonial\
  \ Union, the Earth and the Conclave have been unwillingly dragged into the conflict,\
  \ in the most surprising of ways.<br /><br />Gretchen Trujillo is a mid-level diplomat,\
  \ working in an unimportant part of the Colonial Union bureaucracy. But when she\
  \ is called to take part in a secret mission involving representatives from every\
  \ powerful faction in space, what she finds there has the chance to redefine the\
  \ destinies of humans and aliens alike... or destroy them forever."
