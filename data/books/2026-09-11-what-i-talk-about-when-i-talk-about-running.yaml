description: <i>An alternative cover edition for this ASIN can be found <b><a href="https://www.goodreads.com/book/show/6990835-what-i-talk-about-when-i-talk-about-running"
  rel="nofollow noopener">here</a></b>.</i><br /><br /><b>An intimate look at writing,
  running, and the incredible way they intersect, <i>What I Talk About When I Talk
  About Running</i> is an illuminating glimpse into the solitary passions of one of
  our greatest artists.</b><br /><br />While training for the New York City Marathon,
  Haruki Murakami decided to keep a journal of his progress. The result is a memoir
  about his intertwined obsessions with running and writing, full of vivid recollections
  and insights, including the eureka moment when he decided to become a writer. By
  turns funny and sobering, playful and philosophical, here is a rich and revelatory
  work that elevates the human need for motion to an art form.
