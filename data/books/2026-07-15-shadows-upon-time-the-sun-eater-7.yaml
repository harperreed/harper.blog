description: "<b>The seventh and final novel of the galaxy-spanning series merges\
  \ the best of space opera and epic fantasy, as Hadrian Marlowe at last lights the\
  \ greatest fire humanity has ever seen<br /><br />Ambitious universe-building combines\
  \ with intimate character portraits for storytelling on a truly epic scale\u2014\
  for fans of Orson Scott Card, Adrian Tchaikovsky, Patrick Rothfuss, and Jack Campbell</b><br\
  \ /><br />The trumpet sounds.<br /><br />The end has come at last. After his victory\
  \ at Vorgossos, Hadrian Marlowe finds himself a fugitive, on the run not only from\
  \ the Extrasolarians, but from his own people, the Sollan Empire he betrayed\u2014\
  and who betrayed him. Hidden safely beyond the borders of human space, Hadrian awaits\
  \ the arrival of the one ally he has the Jaddian Prince Kaim-Olorin du Otranto.<br\
  \ /><br />What's more, the inhuman Cielcin have vanished, unseen for more than one\
  \ hundred years. The armies of men have grown complacent, but Hadrian knows the\
  \ the Cielcin are gathering their strength, preparing for their final assault against\
  \ the heart of all mankind.<br /><br />Only Hadrian possesses the power to stem\
  \ the an ancient war machine, forged by the daimon machines at the dawn of time.\
  \ The mighty Demiurge. With it, Hadrian must face not just the Cielcin horde, but\
  \ their Prophet-King, and the dark gods it serves\u2014the very gods who shaped\
  \ the universe itself.<br /><br />This must be."
