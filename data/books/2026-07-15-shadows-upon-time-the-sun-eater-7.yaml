    series:
      description: "The Sun Eater is a sweeping mix of epic science fiction and space\
        \ opera, blending political intrigue, philosophical depth, and high-stakes\
        \ adventure. Set thousands of years in the future in a sprawling interstellar\
        \ empire, the saga is told as the memoir of Hadrian Marlowe \u2014 scholar,\
        \ soldier, and reluctant hero \u2014 who claims to have ended a war and destroyed\
        \ a sun. Across worlds ancient and alien, Hadrian\u2019s journey explores\
        \ questions of power, morality, and what it means to be human, even as he\u2019\
        s drawn into a conflict that will decide the fate of civilizations.\n    \n\
        \    The series consists of five main novels, best read in order, and several\
        \ novellas. The novellas expand on side stories and secondary characters,\
        \ offering richer context, but they\u2019re not strictly required to follow\
        \ the main plot. For first-time readers, the novels provide the core experience,\
        \ while the novellas are a rewarding supplement for those who want to dive\
        \ deeper into the world.\n    \n    German: <b>Imperium</b>"
