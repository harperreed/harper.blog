description: "<b>A battle-worn corporate samurai undertakes one last mission on a\
  \ merciless planet where death is always a mere breath away, in this standalone\
  \ dystopian epic from the author of the modern fantasy classic\_<i>Jade City.\_\
  </i></b><br /><br /><b>LIVE BY THE CODE. DIE BY THE KNIFE.</b><br /><br /> Isako\
  \ is a legendary swordswoman, but every legend must come to an end. When her long-time\
  \ client unexpectedly retires, she plans to follow\u2014to walk out into the frozen\
  \ wasteland of their planet with her head held high and her family enriched by her\
  \ death. But when she's offered a final mission, she can't refuse, especially when\
  \ she realizes who lies at the center of it Martim, her last\u2014and worst\u2014\
  apprentice, who's somehow made his way to the top. As she's thrust into a world\
  \ of corporate espionage and shadowy secrets, what she uncovers could forever change\
  \ humanity's existence among the stars.\_\_<br /><br /><i>The Last Contract of Isako</i>\
  \ is epic science fiction like only Fonda Lee can write it\u2014set in a world where\
  \ money trumps loyalty, the elite have the power to extend life or end it, and one\
  \ woman in the twilight of her calling must decide what's ultimately worth living\u2014\
  or dying\u2014for.<br />"
