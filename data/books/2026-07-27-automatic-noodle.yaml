description: "<b>From sci-fi visionary and acclaimed author Annalee Newitz comes Automatic\
  \ Noodle, a cozy near-future novella about a crew of abandoned food service bots\
  \ opening their very own restaurant.</b><br /><br />While San Francisco rebuilds\
  \ from the chaos of war, a group of food service bots in an abandoned ghost kitchen\
  \ take over their own delivery app account. They rebrand as a neighborhood lunch\
  \ spot and start producing some of the tastiest hand-pulled noodles in the city.\
  \ But there\u2019s just one problem. Someone\u2015or something\u2015is review bombing\
  \ the restaurant\u2019s feedback page with fake \u201Cbad service\u201D reports.\
  \ Can the bots find the culprit before their ratings plummet and destroy everything\
  \ they created?"
