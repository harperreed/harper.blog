description: "<b>Follow the river Liss to the small town of Thistleford, on the edge\
  \ of Faerie, and meet two sisters who cannot be separated, even in death. <br /><br\
  \ /><i>\u201COh what is stronger than a death? Two sisters singing with one breath.\u201D\
  </i></b> <br /><br />In the small town of Thistleford, on the edge of Faerie, dwells\
  \ the mysterious Hawthorn family. <br /><br />There, they tend and harvest the enchanted\
  \ willows and honour an ancient compact to sing to them in thanks for their magic.\
  \ None more devotedly than the family\u2019s latest daughters, Esther and Ysabel,\
  \ who cherish each other as much as they cherish the ancient trees. <br /><br />But\
  \ when Esther rejects a forceful suitor in favor of a lover from the land of Faerie,\
  \ not only the sisters\u2019 bond but also their lives will be at risk\u2026"
