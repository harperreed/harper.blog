description: "<b>From the \u201Cbrilliantly complex\u201D (Jenny Offill) author of\
  \ The Shame comes an electrifying dive into one man\u2019s fractured psyche as he\
  \ searches for a new life.</b><br /><br />Taking place over the course of one day,\
  \ Helen of Nowhere introduces an intimate cast: an unnamed man at the end of both\
  \ his career and marriage, a young realtor showing him an idyllic house in the countryside,\
  \ and Helen, the mystifying former owner whose spectral presence seems to imbue\
  \ the house\u2019s every grain of wood. Through stories of the remarkable woman,\
  \ the man is presented with an alternate way of life. But, as evening fades into\
  \ black, the specifics of how to live it become more than what he bargained for.<br\
  \ /><br />Philosophically adventurous, strange, and fascinating, Helen of Nowhere\
  \ examines the structures that form our identity, staring the reader down to ask\
  \ the haunting question: What is the cost of true happiness?"
