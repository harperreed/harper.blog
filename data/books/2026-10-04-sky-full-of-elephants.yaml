description: "<b>In a world without white people, what does it mean to be Black?</b><br\
  \ /><br />One day, a cataclysmic event occurs: all of the white people in America\
  \ walk into the nearest body of water. A year later, Charlie Brunton is a Black\
  \ man living in an entirely new world. Having served his time in prison for a wrongful\
  \ conviction, he\u2019s now a professor of electric and solar power systems at Howard\
  \ University when he receives a call from someone he wasn\u2019t even sure existed:\
  \ his daughter Sidney, a nineteen-year-old left behind by her white mother and step-family.<br\
  \ /><br />Traumatized by the event, and terrified of the outside world, Sidney has\
  \ spent a year in isolation in Wisconsin. Desperate for help, she turns to the father\
  \ she never met, a man she has always resented. Sidney and Charlie meet for the\
  \ first time as they embark on a journey across a truly \u201Cpost-racial\u201D\
  \ America in search for answers. But neither of them are prepared for this new world\
  \ and how they see themselves in it.<br /><br />Heading south toward what is now\
  \ called the Kingdom of Alabama, everything Charlie and Sidney thought they knew\
  \ about themselves, and the world, will be turned upside down."
