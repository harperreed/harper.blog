description: "2005: Welcome to NoCal and SoCal, the uneasy\_\_sister-states of what\
  \ used to be California. Here the\_\_millenium has come and gone, leaving in its\
  \ wake\_\_only stunned survivors. In Los Angeles, Berry\_\_Rydell is a former armed-response\
  \ rentacop now working\_\_for a bounty hunter. Chevette Washington is a\_\_bicycle\
  \ messenger turned pickpocket who impulsively\_\_snatches a pair of innocent-looking\
  \ sunglasses. But\_\_these are no ordinary shades. What you can see\_\_through these\
  \ high-tech specs can make you rich--or\_\_get you killed. Now Berry and Chevette\
  \ are on the\_\_run, zeroing in on the digitalized heart of\_\_DatAmerica, where\
  \ pure information is the greatest high.\_\_And a mind can be a terrible thing to\
  \ crash..."
