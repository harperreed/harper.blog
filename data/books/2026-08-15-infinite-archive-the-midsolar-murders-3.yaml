description: "<b>Amateur sleuth Mallory Viridian has just about got her bearings aboard\
  \ the space station she calls home, but now the physical embodiment of the Internet\
  \ is on its way, and it\u2019s bringing murder with it.</b><br /><br />Mallory Viridian\
  \ has had a quiet few months. Even with the increased influx of humans visiting\
  \ Station Eternity, she hasn\u2019t seen so much as a bar brawl. Used to people\
  \ dying left and right around her, the lack of murders to solve has left her unexpectedly\
  \ . . . bored.<br /><br />But humanity\u2019s favorite way to waste time is on its\
  \ way to her sector of the galaxy. A giant, one-of-a-kind data ship called <i>Metis</i>\
  \ is bringing the entire Internet from Earth\u2014as well as a mystery fan convention.\
  \ On top of that, Mallory\u2019s literary agent is aboard, and he tells Mallory\
  \ that she\u2019s the keynote speaker.<br /><br />It\u2019s almost a relief when\
  \ a killer decides to strike at the convention. When Mallory finds her agent dead,\
  \ she knows she has to work fast to find the murderer. With a strange new alien\
  \ with unknown motives, a ship with impossible abilities, a lonely living, comprehensive\
  \ Internet, and a deadly crime to solve, Mallory has her work cut out for her .\
  \ . . ."
