description: "<b>From Neal Stephenson, the #1 <i>New York Times </i>bestselling author\
  \ of <i>Polostan </i>and <i>Cryptonomicon, </i>comes the second installment in his\
  \ monumental Bomb Light series\u2014a gripping tale set on the eve of World War\
  \ II, as nations race to find and control an elusive substance critical to building\
  \ atomic weapons.</b><br /><br />Europe, 1934. British journalist Owen Crisp-Upjohn\
  \ is dispatched to Moscow, where his assignments quickly escalate from cultural\
  \ reporting to international espionage. Before long, Owen finds himself pulled into\
  \ the orbit of the enigmatic Earl of Suffolk, a maverick aristocrat, and Aurora,\
  \ a curiously compelling woman with a shadowy past rooted in Soviet intelligence.<br\
  \ /><br />Their mission soon becomes secure the earth\u2019s only supply of deuterium\u2014\
  \u201Cheavy water\u201D\u2014before it falls into Nazi hands. The high-stakes pursuit\
  \ takes them from London\u2019s plush drawing rooms to Barcelona, ravaged by the\
  \ Spanish Civil War; from far-flung Soviet aerodromes to the perilous, icy landscapes\
  \ of occupied Norway. Over time, Owen evolves from a detached observer into a man\
  \ forced to confront profound questions of honor, love, and moral responsibility\
  \ as loyalties are tested and allegiances shift in an ever-tightening web of science,\
  \ intrigue, and deceit.<br /><br />Rich with historical insight, emotionally complex\
  \ characters, and a relentless sense of urgency with a world on the edge of cataclysm,\
  \ <i>D: Heavy Water</i> is a suspenseful and wildly entertaining tale of courage\
  \ and consequence in which humankind\u2019s future is shaped by decisions made in\
  \ the shadows."
