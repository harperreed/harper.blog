{{/*
ABOUTME: Markdown image render hook — standalone images get the site's responsive <figure> treatment
ABOUTME: via the shared figure-image partial; inline images stay plain <img>.
*/}}
{{- /* SVGs are logos/doodles, not photos — no frame. Also: IsBlock is true for
  link-wrapped images goldmark won't unwrap, and a <figure> there would nest
  invalidly inside the <p><a>. */ -}}
{{- if and .IsBlock (ne (path.Ext (.Destination | string)) ".svg") -}}
{{- partial "figure-image.html" (dict
  "Page" .Page
  "Src" (.Destination | string)
  "Alt" .PlainText
  "Caption" (.Title | default "")
  "Class" ""
  "Link" ""
) -}}
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} />
{{- end -}}
