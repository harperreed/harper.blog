{{/* ABOUTME: Generates canonical URL link tag for SEO. */}}
{{/* ABOUTME: Pager pages self-canonicalize via partials/paginator.html; everything else uses .Permalink. */}}
{{- $canonical := .Permalink -}}
{{- with partial "paginator.html" . -}}
  {{- $canonical = .URL | absURL -}}
{{- end -}}
<link rel="canonical" href="{{ $canonical }}" />
