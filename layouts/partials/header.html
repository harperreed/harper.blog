<a class="skip-link" href="#main-content">{{ i18n "skip-link" }}</a>
<a
    href="{{ relURL .Site.Home.RelPermalink }}"
    class="title"
    aria-label="{{ i18n "home-aria" }}"
>
    <img
        src="{{ .Site.Params.avatar }}"
        alt="{{ i18n "avatar-alt" }}"
        class="avatar"
    />
    <h1>{{ .Site.Title }}</h1>
</a>

<nav aria-label="{{ i18n "main-nav-aria" }}">{{- partialCached "nav.html" . -}}</nav>
