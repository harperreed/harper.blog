name: Tools tests

# The content-automation scripts mostly break via dependency bumps flipping
# library behavior (python-frontmatter 1.2 turned every binary-mode dump into
# a zero-byte file) — run their tests whenever tools or their deps change.
on:
    pull_request:
        paths:
            - "tools/**"
            - ".github/workflows/tools-tests.yaml"
    push:
        branches:
            - main
        paths:
            - "tools/**"
            - ".github/workflows/tools-tests.yaml"

permissions:
    contents: read

jobs:
    tools-tests:
        runs-on: ubuntu-latest
        # 10 not 5: the checkout fetch alone has exceeded 5m on slow runners
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 1

            - name: Setup uv
              uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
              with:
                  enable-cache: true
                  cache-dependency-glob: "tools/uv.lock"

            - name: Lint
              working-directory: ./tools
              run: uv run ruff check .

            - name: Run tools test suite
              working-directory: ./tools
              run: uv run pytest -q
