name: Run Goodreads Read Script

on:
    schedule:
        - cron: "0 10 * * *" # Runs daily at 10:00 UTC
    workflow_dispatch: # Allows manual triggering

# A running publish is never killed mid-write; the pending slot holds the
# latest queued tick. The timeout-minutes is the hang backstop.
concurrency:
    group: goodreads-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    issues: write

jobs:
    update-goodreads-tracks:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
            GOODREADS_SECRET: ${{ secrets.GOODREADS_SECRET }}
            GOODREADS_ACCESS_TOKEN: ${{ secrets.GOODREADS_ACCESS_TOKEN }}
            GOODREADS_ACCESS_TOKEN_SECRET: ${{ secrets.GOODREADS_ACCESS_TOKEN_SECRET }}
            GOODREADS_REQUEST_TOKEN: ${{ secrets.GOODREADS_REQUEST_TOKEN }}
            GOODREADS_REQUEST_TOKEN_SECRET: ${{ secrets.GOODREADS_REQUEST_TOKEN_SECRET }}
        steps:
            - name: Check out repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 1

            - name: Install the latest version of uv
              uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
              with:
                  version: "latest"
                  enable-cache: true

            - name: Run goodreads script
              working-directory: ./tools
              run: uv run grab_read_books.py

            - name: Commit and push if changes
              run: |
                  git config --global user.name 'GitHub Action'
                  git config --global user.email 'action@github.com'
                  git add content/books data/books
                  git diff --quiet && git diff --staged --quiet && exit 0
                  git commit -m "Auto update goodreads books"
                  for attempt in 1 2 3; do
                      git pull --rebase origin main && git push && exit 0
                      echo "push attempt ${attempt} failed; retrying"
                      sleep $((attempt * 5))
                  done
                  echo "::error::push failed after 3 rebase attempts"
                  exit 1

            - name: Alert on failure
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  title="Cron failure: ${{ github.workflow }}"
                  run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  existing=$(gh issue list --state open --label automation-failure --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "Still failing: $run_url"
                  else
                      gh issue create --title "$title" --label automation-failure --body "Workflow run failed: $run_url — recovery notes in docs/robustness-audit-2026-08-20.md (failure-visibility section) and gotchas.md (Spotify reauth)."
                  fi
